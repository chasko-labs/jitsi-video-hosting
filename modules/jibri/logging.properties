# Jibri logging config — output to CONSOLE (stdout → CloudWatch) instead of files.
# This gives us visibility into the Selenium/Chrome session creation process.

handlers = java.util.logging.ConsoleHandler

java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = org.jitsi.utils.logging2.JitsiLogFormatter

# Selenium/browser package at FINEST to see chromedriver interaction
org.jitsi.jibri.selenium.level = FINEST
org.openqa.selenium.level = FINE

# Everything else at FINE (same as before)
org.jitsi.level = FINE
org.jitsi.jibri.config.level = INFO
org.glassfish.level = INFO
org.osgi.level = INFO
org.jitsi.xmpp.level = INFO
